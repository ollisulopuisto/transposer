# Does this account get GitHub-hosted ARM runners on a public repo?
#
# transposer is PUBLIC, so it gets no self-hosted runner here (agents.md 6b:
# anyone can open a pull request, and our runner sits beside production
# secrets). That left QEMU as the only way to produce an arm64 image - and this
# image builds Audiveris from source with gradle, which takes 197s natively on
# an Ampere A1 and would be far worse emulated.
#
# GitHub made ubuntu-*-arm runners free for public repositories. If that applies
# here, transposer gets a NATIVE arm64 build with no self-hosted runner and no
# emulation, which is better than both options we had. This job exists only to
# find out; delete it once the answer is known.
name: arm runner probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: What am I
        run: |
          echo "arch:   $(uname -m)"
          echo "cores:  $(nproc)"
          free -m | head -2
          echo "runner: ${RUNNER_NAME:-?} / ${RUNNER_ARCH:-?} / ${RUNNER_OS:-?}"
