name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # The chord-band pass shells out to this. Without it those tests skip
      # rather than fail, which would quietly stop covering the feature.
      - name: Install tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr fonts-dejavu-core

      - name: Install dependencies
        run: pip install -e '.[web,dev]'

      - name: Lint with Ruff
        run: ruff check src tests

      - name: Run tests
        run: pytest -q

      - name: Fail if the chord-band tests skipped
        run: |
          pytest tests/test_chordband.py -q -rs 2>&1 | tee /tmp/band.log
          if grep -q "tesseract binary is not installed" /tmp/band.log; then
            echo "::error::tesseract missing in CI; the LSTM chord-band tests did not run"
            exit 1
          fi

  build-and-push:
    needs: test-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.calver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Whenever the build is going to push. Gating this on a push event alone
      # left a manually dispatched run building fine and then failing at the
      # registry with an anonymous 403.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate CalVer
        id: calver
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          SHA7=$(echo ${GITHUB_SHA} | cut -c1-7)
          VERSION=$(date +'%y.%m.%d').${COMMIT_COUNT}
          IMAGE=ghcr.io/ollisulopuisto/modulaattori
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "sha7=${SHA7}" >> $GITHUB_OUTPUT
          # :latest only ever means main. A manual branch build gets the version
          # and sha tags, so it can be deployed to staging without becoming what
          # anything pulling :latest receives.
          TAGS="${IMAGE}:${VERSION},${IMAGE}:${SHA7}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      # This builds Audiveris from source, so it is slow the first time and
      # mostly cache hits afterwards.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # A manual run pushes too, so a branch can be put on the staging slot
          # and tried against a real scan before its PR is merged.
          push: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.calver.outputs.tags }}

      - name: Create Git Tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ steps.calver.outputs.version }}
          git push origin v${{ steps.calver.outputs.version }}

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Skipped rather than failed while the modulaattori stack does not exist
      # yet on the host: a red build on every push would train everyone to
      # ignore this workflow.
      - name: Deploy to the staging slot
        if: ${{ env.SSH_HOST != '' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            /opt/stacks/scripts/deploy.sh modulaattori deploy ${{ needs.build-and-push.outputs.version }}

  # The arm64 half, built natively on a GitHub-hosted ARM runner.
  #
  # modulaattori moves to oraakkeli3, an Ampere A1, so this image must exist for
  # aarch64. Three ways to get there, and this repo can only use one of them:
  #
  #   self-hosted on the A1  - NO. This repo is PUBLIC, so anyone can open a
  #                            pull request, and our runner shares a disk with
  #                            production secrets. See agents.md 6b.
  #   QEMU on ubuntu-latest  - works, but this image builds Audiveris from
  #                            source with gradle. 197s natively on the A1;
  #                            emulated it is the slowest thing in the estate.
  #   ubuntu-24.04-arm       - native aarch64, 4 cores, and FREE for public
  #                            repositories. Probed 2026-08-21 before relying
  #                            on it, because "free for public repos" is a
  #                            policy that can change under us.
  #
  # Being public is usually the thing that costs us options here. This is the
  # one place it buys one.
  build-arm64:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Same CalVer as build-and-push
        id: vars
        run: echo "version=$(date +'%y.%m.%d').$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      # Required for `cache-to: type=gha`. Without it buildx runs on the default
      # `docker` driver, which cannot export a cache at all - and it fails at
      # the very end of setup with "Cache export is not supported for the docker
      # driver", after the login has already succeeded.
      - uses: docker/setup-buildx-action@v3

      # No platforms: and no QEMU - the runner IS aarch64, so a plain build
      # produces an arm64 image and nothing is emulated.
      - name: Build and push arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
          tags: ghcr.io/ollisulopuisto/modulaattori:${{ steps.vars.outputs.version }}-arm64

      # Both arches under the tags the host pins. The amd64 images were pushed
      # by build-and-push; this replaces those tags with manifest lists that
      # CONTAIN them, so an x86 host resolves to the identical digest it had.
      - name: Publish multi-arch manifests
        env:
          VER: ${{ steps.vars.outputs.version }}
        run: |
          for TAG in "$VER" latest; do
            docker buildx imagetools create \
              --tag "ghcr.io/ollisulopuisto/modulaattori:$TAG" \
              "ghcr.io/ollisulopuisto/modulaattori:$VER" \
              "ghcr.io/ollisulopuisto/modulaattori:$VER-arm64"
            echo "published multi-arch :$TAG"
          done
