name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # The chord-band pass shells out to this. Without it those tests skip
      # rather than fail, which would quietly stop covering the feature.
      - name: Install tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr fonts-dejavu-core

      - name: Install dependencies
        run: pip install -e '.[web,dev]'

      - name: Lint with Ruff
        run: ruff check src tests

      - name: Run tests
        run: pytest -q

      - name: Fail if the chord-band tests skipped
        run: |
          pytest tests/test_chordband.py -q -rs 2>&1 | tee /tmp/band.log
          if grep -q "tesseract binary is not installed" /tmp/band.log; then
            echo "::error::tesseract missing in CI; the LSTM chord-band tests did not run"
            exit 1
          fi

  build-and-push:
    needs: test-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.calver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate CalVer
        id: calver
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "version=$(date +'%y.%m.%d').${COMMIT_COUNT}" >> $GITHUB_OUTPUT
          echo "sha7=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_OUTPUT

      # This builds Audiveris from source, so it is slow the first time and
      # mostly cache hits afterwards.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/ollisulopuisto/modulaattori:latest
            ghcr.io/ollisulopuisto/modulaattori:${{ steps.calver.outputs.version }}
            ghcr.io/ollisulopuisto/modulaattori:${{ steps.calver.outputs.sha7 }}

      - name: Create Git Tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ steps.calver.outputs.version }}
          git push origin v${{ steps.calver.outputs.version }}

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Skipped rather than failed while the modulaattori stack does not exist
      # yet on the host: a red build on every push would train everyone to
      # ignore this workflow.
      - name: Deploy to the staging slot
        if: ${{ env.SSH_HOST != '' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            /opt/stacks/scripts/deploy.sh modulaattori deploy ${{ needs.build-and-push.outputs.version }}
