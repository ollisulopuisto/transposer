[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transposer"
version = "0.1.0"
description = "Self-hosted optical music recognition + transposition + PDF engraving"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "transposer contributors" }]
keywords = ["omr", "sheet-music", "transpose", "musicxml", "music21", "verovio"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
    "music21>=9.9.2",
    "verovio>=6.3.0",
    "cairosvg>=2.9.1",
    "pymupdf>=1.28.2",
    "pillow>=12.3.0",
    "numpy>=2.2.6",
]

[project.optional-dependencies]
# Web UI
web = [
    "fastapi>=0.161.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "jinja2>=3.1.6",
]
# Extra dependencies needed by the bundled Mozart OMR engine
mozart = [
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.2",
    # Mozart's glyph classifier uses cv2.HOGDescriptor, which OpenCV 5 dropped
    # from the Python bindings.
    "opencv-python-headless>=5.0.0.93,<6",
    "imutils>=0.5.4",
    "matplotlib>=3.10.9",
]
# The oemer deep-learning OMR engine (downloads ~200 MB of ONNX weights on
# first run, from GitHub releases)
oemer = ["oemer>=0.1.8"]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    # Starlette's TestClient needs this and does not declare it, so the web
    # tests collect fine on a machine that happens to have it and fail on CI.
    "httpx2>=2.14.0",
]

[project.scripts]
transposer = "transposer.cli:main"

[project.urls]
Homepage = "https://github.com/ollisulopuisto/transposer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
transposer = ["web/templates/*.html", "web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Broad on correctness and hygiene, quiet on house style. The point is catching
# defects, not enforcing one formatter's taste.
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "B",         # bugbear: mutable defaults, shadowed loop vars, bare zip
    "UP",        # pyupgrade
    "SIM",       # simplifiable constructs
    "C4",        # comprehensions
    "RET",       # return-path mistakes
    "PTH",       # os.path calls that should be pathlib
    "A",         # shadowed builtins
    "PIE", "RSE", "RUF",
]
ignore = [
    # Deliberate: the OCR confusion tables are *made of* characters that look
    # like other characters. Flagging them defeats the point of the module.
    "RUF001", "RUF002", "RUF003",
    # A pipeline stage legitimately takes arguments it does not use, because
    # the stages share one signature.
    "ARG002",
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into the modules they test.
"tests/*" = ["ARG001", "ARG005"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
