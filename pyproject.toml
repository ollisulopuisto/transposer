[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transposer"
version = "0.1.0"
description = "Self-hosted optical music recognition + transposition + PDF engraving"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "transposer contributors" }]
keywords = ["omr", "sheet-music", "transpose", "musicxml", "music21", "verovio"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
    "music21>=9.1",
    "verovio>=4.0",
    "cairosvg>=2.7",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Web UI
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
]
# Extra dependencies needed by the bundled Mozart OMR engine
mozart = [
    "scikit-image>=0.22",
    "scikit-learn>=1.3",
    # Mozart's glyph classifier uses cv2.HOGDescriptor, which OpenCV 5 dropped
    # from the Python bindings.
    "opencv-python-headless>=4.8,<5",
    "imutils>=0.5",
    "matplotlib>=3.7",
]
# The oemer deep-learning OMR engine (downloads ~200 MB of ONNX weights on
# first run, from GitHub releases)
oemer = ["oemer>=0.1.7"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
transposer = "transposer.cli:main"

[project.urls]
Homepage = "https://github.com/ollisulopuisto/transposer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
transposer = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
